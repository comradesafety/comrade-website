{#
  icons.html
  Single source of truth for every inline SVG icon used on the site.
  Using {{ icon("name") }} instead of copy-pasted <svg> markup keeps icon
  usage consistent and avoids duplicating paths across templates.
#}

{% macro icon(name, extra_class="") %}

  <path d="M9 21V12H15V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- elif name == "arrow-up-right" -%}
