{#
  icons.html
  Single source of truth for every inline SVG icon used on the site.
  Using {{ icon("name") }} instead of copy-pasted <svg> markup keeps icon
  usage consistent and avoids duplicating paths across templates.
#}

{% macro icon(name, extra_class="") %}
{%- if name == "arrow-up-right" -%}
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="{{ extra_class }}" aria-hidden="true" focusable="false">
  <path d="M7 17L17 7M10 7H17V14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- elif name == "menu" -%}
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="{{ extra_class }}" aria-hidden="true" focusable="false">
  <path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
{%- elif name == "close" -%}
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="{{ extra_class }}" aria-hidden="true" focusable="false">
  <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
{%- endif -%}
{% endmacro %}
